name: iOS CI

on:
  workflow_dispatch:

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show available simulators
        run: |
          xcrun simctl list devices available

      - name: Build app
        run: |
          xcodebuild clean build \
            -workspace NasiShadchanHelper.xcworkspace \
            -scheme NasiShadchanHelper \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
