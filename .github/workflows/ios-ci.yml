name: iOS CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild clean build \
          -workspace NasiShadchanHelper.xcworkspace \
          -scheme NasiShadchanHelper \
          -destination 'generic/platform=iOS Simulator'
